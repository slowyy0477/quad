<!doctype html>
<html lang="en">
  <body>
    <h1>Set a new Bulla password</h1>
    <p>Someone requested a password reset for this account.</p>
    <p><a href="{{ .SiteURL }}/auth/recovery?token_hash={{ .TokenHash }}&amp;type=recovery">Choose a new password</a></p>
    <p>The link works once. Its expiry is set by your account service.</p>
    <p>If you did not request this, ignore this email. Opening the link does not change your password.</p>
  </body>
</html>
