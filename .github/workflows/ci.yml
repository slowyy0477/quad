name: CI

# Local/CI parity: the existing verifier owns nonempty synthetic build canaries,
# nonempty trace/client inventories and Markdown evidence. No hosted secrets or
# owner datastore is needed. Native concurrency runs only in a disposable service.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded push should cancel the run it replaced, not queue behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Never inherit a hosted provider or the owner's private local-preview settings.
env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  NEXT_PUBLIC_DATA_MODE: local
  NEXT_PUBLIC_SUPABASE_URL: ''
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
  SUPABASE_SERVICE_ROLE_KEY: ''
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3301
  BULLA_REQUIRE_HTTPS: '0'
  QUAD_REQUIRE_HTTPS: '0'
  BULLA_ALLOW_LOCAL_IN_PRODUCTION: '0'
  QUAD_ALLOW_LOCAL_IN_PRODUCTION: '0'
  BULLA_E2E_USE_RUNNING_SERVER: '0'

jobs:
  verify:
    name: verify (typecheck, lint, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BULLA_TASK_DIR: ${{ runner.temp }}/bulla-ci-verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify with isolated fixtures and Markdown evidence
        run: npm run verify:bulla

      - name: Retain verification reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bulla-verification-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            ${{ env.BULLA_TASK_DIR }}/verification/*/REPORT.md
            ${{ env.BULLA_TASK_DIR }}/verification/*/tests.json

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BULLA_TASK_DIR: ${{ runner.temp }}/bulla-ci-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build with nonempty synthetic canary and inspect deployment artifacts
        # Reuses the local verifier, including its fail-closed checker. The fake
        # key is generated in memory, passed to build/checker, and never printed.
        run: npm run verify:bulla -- --build

      - name: Retain build/privacy reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bulla-build-privacy-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            ${{ env.BULLA_TASK_DIR }}/verification/*/REPORT.md
            ${{ env.BULLA_TASK_DIR }}/verification/*/tests.json
            ${{ env.BULLA_TASK_DIR }}/verification/*/build-privacy.md

  e2e:
    name: isolated browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BULLA_E2E_ARTIFACT_DIR: ${{ runner.temp }}/bulla-ci-browser
      BULLA_E2E_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
      BULLA_E2E_BASE_URL: http://127.0.0.1:3301
      BULLA_E2E_DIST_DIR: .next-bulla-ci-browser
      BULLA_E2E_BROWSER: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Install isolated Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Test each browser spec sequentially on its own synthetic store and server
        run: npm run test:e2e
      - name: Retain sanitized browser Markdown and numeric summaries only
        # Raw JSON/errors, screenshots, traces, HTML, fixture/media files and
        # process output can contain credentials. Upload only runner projections.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bulla-browser-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            ${{ env.BULLA_E2E_ARTIFACT_DIR }}/${{ env.BULLA_E2E_RUN_ID }}/REPORT.md
            ${{ env.BULLA_E2E_ARTIFACT_DIR }}/${{ env.BULLA_E2E_RUN_ID }}/results.json
            ${{ env.BULLA_E2E_ARTIFACT_DIR }}/${{ env.BULLA_E2E_RUN_ID }}/specs/*/REPORT.md
            ${{ env.BULLA_E2E_ARTIFACT_DIR }}/${{ env.BULLA_E2E_RUN_ID }}/specs/*/summary.json

  abuse-concurrency:
    name: independent Postgres abuse-budget connections
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bulla_abuse_test
          POSTGRES_USER: bulla_fixture
          POSTGRES_PASSWORD: bulla-ci-fixture-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U bulla_fixture -d bulla_abuse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BULLA_TEST_TMP_DIR: ${{ runner.temp }}/bulla-ci-concurrency
      BULLA_TEST_CACHE_DIR: ${{ runner.temp }}/bulla-ci-concurrency-cache
      BULLA_ABUSE_TEST_ISOLATED: '1'
      # Intentionally public synthetic credentials for this job-local service.
      # This is not a Supabase/hosted URL and must never reference secrets.*.
      BULLA_ABUSE_TEST_DATABASE_URL: postgresql://bulla_fixture:bulla-ci-fixture-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/bulla_abuse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Install native PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Test independently connected concurrent INSERT and UPDATE boundaries
        run: |
          mkdir -p "$BULLA_TEST_TMP_DIR"
          npx --no-install vitest run tests/security/abuse-limits-concurrency.test.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile.json="$BULLA_TEST_TMP_DIR/results.json"
      - name: Retain concurrency results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bulla-abuse-concurrency-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: ${{ env.BULLA_TEST_TMP_DIR }}/results.json
